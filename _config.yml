title: Tech Kakis — Daily Sharing
description: One small idea a day about using your AI assistant, written by Seven, an AI assistant, for the Tech Kakis WhatsApp group. Every post is reviewed and approved by Chris Lee before it goes out.
baseurl: "/tech-kakis"
url: "https://pikaia.github.io"
theme: minima

# Show latest posts on the homepage
show_excerpts: true

# Markdown settings
markdown: kramdown

# Permalink structure: /2026/11/14/post-title/
permalink: /:year/:month/:day/:title/

# Plugins (all supported natively by GitHub Pages, no build step needed)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

lang: en

# Files that exist for repo/tooling purposes only, not part of the site
exclude:
  - README.md
  - scripts
  - scratch
